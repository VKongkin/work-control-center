# Runs the images published by the GitHub workflow instead of building locally.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Override the tag to pin a release:  WCC_TAG=v1.0.0 docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:15-alpine
    container_name: wcc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcc_user
      POSTGRES_PASSWORD: wcc_password
      POSTGRES_DB: wcc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcc_user -d wcc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wcc-network

  backend:
    image: vkongkin/work-control-center:backend-${WCC_TAG:-latest}
    container_name: wcc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wcc_user:wcc_password@db:5432/wcc_db
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: production
      SQL_ECHO: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wcc-network

  frontend:
    image: vkongkin/work-control-center:frontend-${WCC_TAG:-latest}
    container_name: wcc_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wcc-network

  adminer:
    image: adminer
    container_name: wcc_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - wcc-network

volumes:
  postgres_data:

networks:
  wcc-network:
    driver: bridge
