# Builds both images from the source in this repository. Use this while
# developing; use the default docker-compose.yml to run published images.
#
#   docker compose -f docker-compose.build.yml up -d --build
name: work-control-center

services:
  db:
    image: postgres:15-alpine
    container_name: wcc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wcc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcc_password}
      POSTGRES_DB: ${POSTGRES_DB:-wcc_db}
    ports:
      # Bound to the loopback address, not 0.0.0.0. Postgres holds everything
      # this app knows and its password is a well-known default, so it has no
      # business answering the network. Set DB_BIND=0.0.0.0 if you genuinely
      # need to reach it from another machine - and change POSTGRES_PASSWORD
      # first if you do.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wcc_user} -d ${POSTGRES_DB:-wcc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wcc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vkongkin/work-control-center:backend-local
    container_name: wcc_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wcc_user}:${POSTGRES_PASSWORD:-wcc_password}@db:5432/${POSTGRES_DB:-wcc_db}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      ENVIRONMENT: development
      SQL_ECHO: "False"
      # Same passthrough as docker-compose.yml - see the note there.
      WCC_SECRET_KEY: ${WCC_SECRET_KEY:-}
      WCC_VAULT_KEY: ${WCC_VAULT_KEY:-}
      WCC_AGENT_KEY: ${WCC_AGENT_KEY:-}
      WCC_AGENT_EXPOSE_ACCOUNTS: ${WCC_AGENT_EXPOSE_ACCOUNTS:-0}
      WCC_AUTO_SYNC: ${WCC_AUTO_SYNC:-1}
      WCC_SYNC_TICK_SECONDS: ${WCC_SYNC_TICK_SECONDS:-60}
      WCC_TIMEZONE: ${WCC_TIMEZONE:-}
    ports:
      # This one stays on all interfaces by default: reaching the API from
      # another machine is the point of the agent interface. Note that the app
      # has no login - see "Who can reach it" in DEPLOY.md before relying on
      # that. BIND_HOST=127.0.0.1 makes the whole app local-only.
      - "${BIND_HOST:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wcc-network
    # Source is mounted so backend edits take effect without a rebuild.
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vkongkin/work-control-center:frontend-local
    container_name: wcc_frontend
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - wcc-network

  adminer:
    image: adminer
    container_name: wcc_adminer
    restart: unless-stopped
    ports:
      # Loopback too. Adminer is a full database console with no password of
      # its own; reachable from the network it is simply a way in.
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - wcc-network

volumes:
  postgres_data:
    # Pinned to the name it already had, so an existing database keeps working
    # and no longer depends on what this folder is called.
    name: work-control-center_postgres_data

networks:
  wcc-network:
    driver: bridge
